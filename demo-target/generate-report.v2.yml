name: Generate report

on:
  workflow_dispatch:
    inputs:
      report_type:
        description: Report type
        type: choice
        required: true
        default: quarterly
        options:
          - quarterly
          - audit
          - tax
      month:
        description: Billing month (YYYY-MM)
        type: string
        required: true
        default: "2026-09"
      customer:
        description: Customer name
        type: string
        required: true
        default: acme
      region:
        description: Region
        type: choice
        required: true
        default: india
        options:
          - india
          - us
          - eu

run-name: ${{ inputs.report_type }} ${{ inputs.month }} ${{ inputs.customer }} ${{ inputs.region }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab
      - name: Render PDF
        run: >
          python scripts/generate_report.py
          --report-type "${{ inputs.report_type }}"
          --month "${{ inputs.month }}"
          --customer "${{ inputs.customer }} (${{ inputs.region }})"
          --variant v2
          --out out/report-${{ inputs.report_type }}-${{ inputs.month }}-${{ inputs.region }}.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ inputs.report_type }}-${{ inputs.month }}-${{ inputs.region }}
          path: out/*.pdf
